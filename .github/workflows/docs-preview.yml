name: Fern docs preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "fern/**"
      - "docs/assets/recipes/**"
      - "docs/notebook_source/**"
      - "docs/colab_notebooks/**"
      - "docs/scripts/**"
      - "packages/data-designer-config/src/data_designer/config/**"
      - "packages/data-designer/src/data_designer/interface/**"
      - "packages/data-designer-engine/src/data_designer/engine/column_generators/generators/base.py"
      - "packages/data-designer-engine/src/data_designer/engine/mcp/**"
      - "packages/data-designer-engine/src/data_designer/engine/processing/processors/**"
      - "packages/data-designer-engine/src/data_designer/engine/resources/seed_reader.py"
      - ".github/workflows/docs-preview.yml"

permissions: {}

concurrency:
  group: fern-docs-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  FERN_PUBLISHED_BRANCH: docs-website

jobs:
  build:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Written first so a failed build can still report on the PR (see docs-preview-deploy.yml).
      - name: Save preview metadata
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          METADATA_DIR: ${{ runner.temp }}/fern-preview-metadata
        run: |
          mkdir -p "$METADATA_DIR"
          echo "$PR_NUMBER" > "$METADATA_DIR/pr_number"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.9.5"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install docs dependencies
        run: uv sync --all-packages --group docs --group notebooks

      - name: Verify published Fern archive exists
        run: |
          if ! git ls-remote --exit-code --heads origin "$FERN_PUBLISHED_BRANCH" >/dev/null 2>&1; then
            echo "::error::$FERN_PUBLISHED_BRANCH does not exist. Publish a Fern release snapshot first."
            exit 1
          fi

      - name: Checkout published Fern archive
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          path: published-fern-preview
          ref: ${{ env.FERN_PUBLISHED_BRANCH }}

      - name: Prepare Fern preview source
        env:
          FERN_PREVIEW_ROOT: ${{ runner.temp }}/fern-preview
        run: |
          rm -rf "$FERN_PREVIEW_ROOT"
          mv published-fern-preview "$FERN_PREVIEW_ROOT"
          python3 fern/scripts/fern-published-branch.py sync-source \
            --source-root "$GITHUB_WORKSPACE" \
            --published-root "$FERN_PREVIEW_ROOT"

      - name: Check Fern docs
        id: fern-check
        continue-on-error: true
        env:
          FERN_PREVIEW_ROOT: ${{ runner.temp }}/fern-preview
        run: |
          cd "$FERN_PREVIEW_ROOT"
          make check-fern-docs \
            DOCS_PYTHON="$GITHUB_WORKSPACE/.venv/bin/python" \
            DOCS_JUPYTEXT="$GITHUB_WORKSPACE/.venv/bin/jupytext"

      - name: Skip hosted previews for fork PRs
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: echo "::notice::Skipping hosted docs previews because this PR comes from a fork."

      # docs-preview-deploy.yml publishes this artifact with DOCS_FERN_TOKEN.
      # Only the fern/ subtree is uploaded; the checkout's .git stays behind.
      - name: Upload preview artifact
        if: ${{ !cancelled() && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fern-docs-preview
          path: |
            ${{ runner.temp }}/fern-preview/fern
            ${{ runner.temp }}/fern-preview-metadata
          include-hidden-files: true
          retention-days: 1

      - name: Fail if Fern docs check failed
        if: steps.fern-check.outcome == 'failure'
        run: exit 1
